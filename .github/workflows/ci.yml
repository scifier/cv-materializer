name: CI

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install system dependencies for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser xvfb libxss1
      - name: Install dependencies
        run: npm install
      - name: Building static webpage
        env:
          REACT_APP_EXTRA: ${{ secrets.REACT_APP_EXTRA }}
        run: npm run build
      - name: Deploy to GitHub Pages repository
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.API_TOKEN_GITHUB }}
          external_repository: ${{ github.repository_owner }}/${{ github.repository_owner }}.github.io
          publish_branch: master
          publish_dir: ./build
